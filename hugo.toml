baseURL = "https://arkana-mechanika-labs.github.io/"
languageCode = "en-us"
title = "Darklands Restoration Project"
enableRobotsTXT = true

[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false

[params]
  description = "MicroProse's Darklands (1992) rebuilt in C# to run on today's Windows and to play exactly like the original. Version 1.0 is out."
  images = ["/images/0.9.0/city.png"]

  [params.theme]
    default = "dark"
    displayToggle = false

  [params.navbar]
    displayTitle = true
    displayLogo = false

  [params.footer]
    enable = true
    displayCopyright = false
    displayPoweredBy = false

