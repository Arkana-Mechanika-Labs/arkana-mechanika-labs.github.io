baseURL = "https://arkana-mechanika-labs.github.io/"
languageCode = "en-us"
title = "Darklands Restoration Project"
enableRobotsTXT = true

[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false

[params]
  description = "A faithful native C# reconstruction of MicroProse Darklands (1992), rebuilt from original code and data with evidence-backed verification."
  images = ["/images/classic-mainst.png"]

  [params.theme]
    default = "dark"
    displayToggle = true

  [params.navbar]
    displayTitle = true
    displayLogo = false

  [params.footer]
    enable = true
    displayCopyright = true

