{{ define "main" }}
<div class="dlh" id="content">
  <section class="dlh-block dlp-page">
    <div class="dlh-wrap">
      <h1 class="dl-title dlp-h1">{{ .Title }}</h1>
      <div class="content">{{ .Content }}</div>
    </div>
  </section>
</div>
{{- if strings.Contains .Content "dlh-player" }}
<script>
document.querySelectorAll(".dlh-player").forEach(function (p) {
  function play() {
    var f = document.createElement("iframe");
    f.src = "https://www.youtube-nocookie.com/embed/" + p.dataset.yt + "?autoplay=1";
    f.title = p.dataset.title || "Darklands Restoration Project"; f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen"; f.allowFullscreen = true;
    p.innerHTML = ""; p.appendChild(f); p.style.cursor = "default";
  }
  p.addEventListener("click", play, { once: true });
  p.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); play(); } });
});
</script>
{{- end }}
{{ end }}
